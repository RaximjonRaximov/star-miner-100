<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Miner: 100 Missions</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
  <div id="app">
    <header>
      <img class="header-bg" src="assets/banner.png" alt="Star Miner 100 Missions banner">
      <div class="header-glass">
        <div class="brand">
          <img src="assets/favicon.png" alt="Star Miner" class="logo">
          <div class="brand-text">
            <h1>Star Miner</h1>
            <span class="tagline">100 Missions</span>
          </div>
        </div>
        <div class="stats">
          <div class="stat">
            <span class="stat-label">Credits</span>
            <span class="stat-value" id="credit-display">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Missions</span>
            <span class="stat-value" id="mission-completed">0 / 100</span>
          </div>
        </div>
        <div class="controls">
          <button id="save-btn" class="btn-small">Save</button>
          <button id="reset-btn" class="btn-small">Reset</button>
        </div>
      </div>
    </header>

    <main>
      <section class="viewport">
        <div class="belt-bar" id="belt-bar"></div>
        <div class="canvas-wrap">
          <canvas id="asteroid-canvas"></canvas>
          <div class="hint">Click the asteroid to mine. Switch belts to target different ores.</div>
        </div>
      </section>

      <section class="deck">
        <nav class="deck-tabs">
          <button class="tab active" data-tab="cargo">Cargo</button>
          <button class="tab" data-tab="upgrades">Upgrades</button>
          <button class="tab" data-tab="missions">Missions</button>
        </nav>
        <div class="deck-content">
          <div class="tab-panel active" id="panel-cargo">
            <div class="capacity">
              <div class="capacity-header">
                <span class="capacity-label">Cargo Hold</span>
                <span id="capacity-text">0 / 0</span>
              </div>
              <div class="capacity-bar">
                <div class="capacity-fill" id="capacity-fill"></div>
              </div>
            </div>
            <div class="resource-list" id="resource-list"></div>
            <button class="sell-all-btn" id="sell-all">Sell All Resources</button>
          </div>

          <div class="tab-panel" id="panel-upgrades">
            <div class="upgrade-list" id="upgrade-list"></div>
          </div>

          <div class="tab-panel" id="panel-missions">
            <div class="mission-list" id="mission-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast-area"></div>
  <script src="js/missions.js"></script>
  <script src="js/game.js"></script>
  <script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      });
    });
  </script>
</body>
</html>
